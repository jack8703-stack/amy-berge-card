<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Jack Berge</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700;0,800;1,500&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  /* Jack Berge — the wow card. Black + Cardinal red, holographic 3D tilt, rising embers, living skyline. */
  :root{
    --red:#c8102e; --red2:#ff2e4d; --ember:#ff7a3c; --gold:#ffd36b;
    --ink:#f4f1ec; --muted:#a79f98;
    --serif:"Playfair Display", Georgia, serif; --sans:"Jost","Segoe UI",system-ui,sans-serif;
    color-scheme: dark;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{background:#07070a;color:var(--ink);font-family:var(--sans);-webkit-font-smoothing:antialiased;overflow:hidden}
  #embers{position:fixed;inset:0;z-index:0;display:block}
  .bgglow{position:fixed;left:50%;top:38%;width:min(90vw,520px);height:min(90vw,520px);transform:translate(-50%,-50%);
    background:radial-gradient(closest-side, rgba(200,16,46,.42), rgba(200,16,46,.08) 55%, transparent 70%);
    filter:blur(10px);z-index:0;animation:breathe 5.5s ease-in-out infinite}
  @keyframes breathe{0%,100%{opacity:.75;transform:translate(-50%,-50%) scale(1)}50%{opacity:1;transform:translate(-50%,-50%) scale(1.08)}}

  .stage{position:relative;z-index:2;min-height:100%;display:flex;align-items:center;justify-content:center;
    padding:26px 16px;perspective:1100px}
  .card{position:relative;width:100%;max-width:372px;border-radius:22px;overflow:hidden;
    background:linear-gradient(185deg,#1a1116,#0c0a0d 70%);
    border:1px solid rgba(255,46,77,.28);
    box-shadow:0 40px 90px -34px #000, 0 0 44px -18px rgba(200,16,46,.6), inset 0 1px 0 rgba(255,255,255,.05);
    transform:rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg));
    transform-style:preserve-3d;transition:transform .12s ease-out;
    animation:enter 1s cubic-bezier(.2,.8,.2,1) both}
  @keyframes enter{from{opacity:0;transform:translateY(26px) rotateX(16deg) scale(.95)}to{opacity:1}}
  /* holographic sheen that follows the tilt */
  .holo{position:absolute;inset:0;z-index:4;pointer-events:none;mix-blend-mode:screen;opacity:.5;
    background:linear-gradient(115deg, transparent 32%, rgba(255,210,120,.28) 44%, rgba(255,46,77,.32) 50%, rgba(120,180,255,.22) 56%, transparent 68%);
    background-size:220% 220%;background-position:calc(var(--mx,50%) * 1) calc(var(--my,50%) * 1);transition:background-position .1s}
  /* periodic light sweep */
  .shine{position:absolute;top:0;bottom:0;width:60%;z-index:5;pointer-events:none;
    background:linear-gradient(105deg, transparent, rgba(255,255,255,.14), transparent);
    transform:skewX(-18deg);left:-70%;animation:sweep 6s ease-in-out 1.4s infinite}
  @keyframes sweep{0%{left:-70%}22%{left:130%}100%{left:130%}}

  .hero{position:relative;height:160px;overflow:hidden;background:radial-gradient(120% 95% at 50% 0%, #2a0e15, #0b0a0c 74%)}
  .hero svg{position:absolute;left:0;right:0;bottom:0;width:100%;height:98px;display:block}
  .hero::after{content:"";position:absolute;inset:0;background:linear-gradient(to bottom, transparent 42%, rgba(12,10,13,.55), #140d10)}
  .tw{animation:tw 2.6s ease-in-out infinite}
  @keyframes tw{0%,100%{opacity:.25}50%{opacity:1}}

  .body{position:relative;z-index:6;padding:0 24px 26px;text-align:center}
  .avatar{width:176px;height:176px;border-radius:50%;object-fit:cover;display:block;margin:-94px auto 0;position:relative;z-index:6;
    border:4px solid var(--red2);box-shadow:0 0 0 7px rgba(200,16,46,.16),0 20px 38px -12px #000;animation:ring 3.4s ease-in-out infinite}
  @keyframes ring{0%,100%{box-shadow:0 0 0 7px rgba(200,16,46,.14),0 20px 38px -12px #000}50%{box-shadow:0 0 0 12px rgba(255,46,77,.22),0 20px 42px -10px #000}}
  .name{font-family:var(--serif);font-weight:800;font-size:2.25rem;line-height:1;margin:14px 0 0;color:#fff;
    text-shadow:0 2px 18px rgba(200,16,46,.5)}
  .role{margin:11px 0 0;font-size:.72rem;letter-spacing:.28em;text-transform:uppercase;color:var(--red2);font-weight:600}
  .org{margin:7px 0 0;font-family:var(--serif);font-style:italic;font-size:1.02rem;color:var(--ink)}
  .loc{margin:3px 0 0;font-size:.72rem;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
  .rule{height:1px;background:linear-gradient(90deg,transparent,rgba(255,46,77,.6),transparent);margin:17px 0 2px}
  .rows{display:flex;flex-direction:column;gap:9px;margin-top:14px}
  .row{display:flex;align-items:center;gap:13px;padding:11px 14px;border-radius:12px;border:1px solid rgba(255,255,255,.08);
    background:rgba(255,255,255,.02);text-decoration:none;color:var(--ink);text-align:left;
    opacity:0;animation:rise .5s ease forwards}
  .row:nth-child(1){animation-delay:.5s}.row:nth-child(2){animation-delay:.62s}.row:nth-child(3){animation-delay:.74s}.row:nth-child(4){animation-delay:.86s}
  @keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  .row .ico{width:19px;height:19px;flex:none;color:var(--red2)}
  .row .lbl{flex:1;min-width:0}
  .row .lbl b{display:block;font-weight:500;font-size:.68rem;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
  .row .lbl span{display:block;font-size:.95rem;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .save{display:flex;align-items:center;justify-content:center;gap:10px;margin-top:16px;padding:15px;border-radius:12px;
    border:none;cursor:pointer;text-decoration:none;position:relative;overflow:hidden;
    background:linear-gradient(135deg,var(--red2),var(--red) 60%,#8c0c20);color:#fff;
    font:600 1.02rem var(--sans);letter-spacing:.02em;box-shadow:0 14px 30px -12px rgba(200,16,46,.8)}
  .save::after{content:"";position:absolute;top:0;bottom:0;width:40%;left:-60%;transform:skewX(-20deg);
    background:linear-gradient(100deg,transparent,rgba(255,255,255,.4),transparent);animation:sweep 3.6s ease-in-out 2s infinite}
  .save svg{width:20px;height:20px;position:relative}
  .foot{text-align:center;margin-top:16px;font-size:.64rem;letter-spacing:.28em;text-transform:uppercase;color:var(--muted)}
  .foot b{color:var(--red2);font-weight:600}
  .tiltcue{position:fixed;left:0;right:0;bottom:14px;text-align:center;z-index:3;font-size:.7rem;letter-spacing:.16em;
    text-transform:uppercase;color:rgba(255,255,255,.4);animation:cue 3s ease-in-out infinite}
  @keyframes cue{0%,100%{opacity:.3}50%{opacity:.7}}
  @media (prefers-reduced-motion: reduce){*{animation:none!important}.card{transition:none}}
</style>
</head>
<body>
  <canvas id="embers"></canvas>
  <div class="bgglow"></div>
  <main class="stage">
    <div class="card" id="card">
      <div class="holo"></div>
      <div class="shine"></div>
      <div class="hero">
        <svg viewBox="0 0 372 98" preserveAspectRatio="xMidYMax meet" aria-hidden="true">
          <g fill="#c8102e" opacity="0.9">
            <rect x="6" y="56" width="20" height="42"/><rect x="30" y="40" width="15" height="58"/>
            <rect x="49" y="64" width="24" height="34"/><rect x="77" y="28" width="18" height="70"/>
            <rect x="99" y="48" width="27" height="50"/><rect x="130" y="16" width="22" height="82"/>
            <rect x="156" y="42" width="16" height="56"/><rect x="176" y="6" width="24" height="92"/>
            <rect x="204" y="34" width="20" height="64"/><rect x="228" y="56" width="26" height="42"/>
            <rect x="258" y="22" width="18" height="76"/><rect x="280" y="48" width="27" height="50"/>
            <rect x="311" y="38" width="16" height="60"/><rect x="331" y="60" width="24" height="38"/>
          </g>
          <rect x="186" y="6" width="4" height="92" fill="#ff2e4d"/>
          <g fill="#ffd36b">
            <rect class="tw" x="84" y="40" width="3" height="3"/><rect class="tw" x="138" y="34" width="3" height="3" style="animation-delay:.6s"/>
            <rect class="tw" x="184" y="22" width="3" height="3" style="animation-delay:1.1s"/><rect class="tw" x="265" y="38" width="3" height="3" style="animation-delay:.3s"/>
            <rect class="tw" x="106" y="60" width="3" height="3" style="animation-delay:1.6s"/><rect class="tw" x="318" y="52" width="3" height="3" style="animation-delay:.9s"/>
          </g>
        </svg>
      </div>
      <div class="body">
        <img class="avatar" src="jack-avatar.jpg" alt="Jack Berge">
        <h1 class="name">Jack Berge</h1>
        <div class="role">Operations Manager</div>
        <div class="org">Gaslight Square Animal Hospital</div>
        <div class="loc">Louisville, Kentucky</div>
        <div class="rule"></div>
        <div class="rows">
          <a class="row" href="tel:+15027277173">
            <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3 19.5 19.5 0 0 1-6-6 19.8 19.8 0 0 1-3-8.6A2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1.9.4 1.8.7 2.7a2 2 0 0 1-.5 2.1L8.1 9.9a16 16 0 0 0 6 6l1.4-1.2a2 2 0 0 1 2.1-.5c.9.3 1.8.6 2.7.7a2 2 0 0 1 1.7 2z"/></svg>
            <span class="lbl"><b>Cell</b><span>(502) 727-7173</span></span>
          </a>
          <a class="row" href="mailto:wjberge@gaslightvet.com">
            <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/></svg>
            <span class="lbl"><b>Email &middot; Work</b><span>wjberge@gaslightvet.com</span></span>
          </a>
          <a class="row" href="mailto:jack8703@me.com">
            <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="M22 6l-10 7L2 6"/></svg>
            <span class="lbl"><b>Email &middot; Personal</b><span>jack8703@me.com</span></span>
          </a>
          <a class="row" href="https://gaslightvet.com" target="_blank" rel="noopener">
            <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M2 12h20M12 2a15 15 0 0 1 0 20 15 15 0 0 1 0-20z"/></svg>
            <span class="lbl"><b>Clinic</b><span>gaslightvet.com</span></span>
          </a>
        </div>
        <a class="save" href="#" id="saveBtn">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M19 8v6M22 11h-6"/></svg>
          Save to contacts
        </a>
        <div class="foot"><b>Louisville</b> &middot; Kentucky</div>
      </div>
    </div>
  </main>
  <div class="tiltcue" id="cue">Tilt me &middot; Tap to save</div>
<script>
  // rising embers
  var cv=document.getElementById("embers"), ctx=cv.getContext("2d"), W,H,parts=[];
  function size(){ W=cv.width=innerWidth; H=cv.height=innerHeight; }
  size(); addEventListener("resize", size);
  function spawn(){ return {x:Math.random()*W, y:H+10, r:Math.random()*2.3+.6, vy:-(Math.random()*.7+.3),
    vx:(Math.random()-.5)*.4, life:Math.random()*160+120, age:0, h:Math.random()<.5?8:28}; }
  for(var i=0;i<46;i++){ var p=spawn(); p.y=Math.random()*H; parts.push(p); }
  function tick(){ ctx.clearRect(0,0,W,H);
    for(var i=0;i<parts.length;i++){ var p=parts[i]; p.age++; p.y+=p.vy; p.x+=p.vx; p.vx+=(Math.random()-.5)*.03;
      var a=Math.max(0,1-p.age/p.life)*.8;
      var g=ctx.createRadialGradient(p.x,p.y,0,p.x,p.y,p.r*4);
      g.addColorStop(0,"rgba(255,"+(120+p.h*4)+","+(40+p.h)+","+a+")");
      g.addColorStop(1,"rgba(200,16,46,0)");
      ctx.fillStyle=g; ctx.beginPath(); ctx.arc(p.x,p.y,p.r*4,0,7); ctx.fill();
      if(p.age>p.life||p.y<-20) parts[i]=spawn(); }
    requestAnimationFrame(tick); }
  tick();

  // 3D tilt — pointer on desktop, gyro on mobile
  var card=document.getElementById("card"), holo=document.querySelector(".holo");
  function setTilt(ry,rx,mx,my){ card.style.setProperty("--ry",ry.toFixed(2)+"deg");
    card.style.setProperty("--rx",rx.toFixed(2)+"deg");
    holo.style.setProperty("--mx",mx.toFixed(1)+"%"); holo.style.setProperty("--my",my.toFixed(1)+"%"); }
  addEventListener("pointermove",function(e){ var cx=innerWidth/2, cy=innerHeight/2;
    var dx=(e.clientX-cx)/cx, dy=(e.clientY-cy)/cy;
    setTilt(dx*10, -dy*10, 50+dx*50, 50+dy*50); });
  function gyro(e){ var g=e.gamma||0, b=e.beta||0;
    var ry=Math.max(-14,Math.min(14,g*0.5)), rx=Math.max(-14,Math.min(14,(b-45)*0.4));
    setTilt(ry, -rx, 50+ry*3.4, 50+rx*3.4); }
  var cue=document.getElementById("cue");
  function enableGyro(){ if(window.DeviceOrientationEvent){
      if(typeof DeviceOrientationEvent.requestPermission==="function"){
        DeviceOrientationEvent.requestPermission().then(function(s){ if(s==="granted") addEventListener("deviceorientation",gyro); }).catch(function(){});
      } else { addEventListener("deviceorientation",gyro); } } }
  addEventListener("touchstart", enableGyro, {once:true});

  // save to contacts
  var vcard=["BEGIN:VCARD","VERSION:3.0","N:Berge;Jack;;;","FN:Jack Berge","ORG:Gaslight Square Animal Hospital","TITLE:Operations Manager","TEL;TYPE=CELL,VOICE:+15027277173","EMAIL;TYPE=WORK:wjberge@gaslightvet.com","EMAIL;TYPE=HOME:jack8703@me.com","URL:https://gaslightvet.com","ADR;TYPE=WORK:;;10516 Watterson Trail;Louisville;KY;40299;USA","END:VCARD"].join("\r\n");
  document.getElementById("saveBtn").addEventListener("click",function(e){ e.preventDefault();
    try{ var blob=new Blob([vcard],{type:"text/vcard;charset=utf-8"}); var u=URL.createObjectURL(blob);
      var a=document.createElement("a"); a.href=u; a.download="JackBerge.vcf"; document.body.appendChild(a); a.click();
      document.body.removeChild(a); setTimeout(function(){URL.revokeObjectURL(u)},1500); }catch(err){} });
</script>
</body>
</html>
