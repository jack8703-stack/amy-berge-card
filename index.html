<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Amy Berge</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Pinyon+Script&family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  /* A garden keepsake as a web page — cream paper, gold line, soft blush washes.
     Single, deliberate light theme to match the printed card. */
  :root{
    --cream-1:#f8f2e4; --cream-2:#efe6d2; --ink:#43392e; --ink-soft:#6a5d4c;
    --gold:#b58a3e; --gold-soft:#c9a362; --rose:#d98a98; --line:rgba(181,138,62,.35);
    --font-script:"Pinyon Script", cursive;
    --font-serif:"Cormorant Garamond", Georgia, serif;
    --font-sans:"Jost", "Segoe UI", system-ui, sans-serif;
    color-scheme: light;
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{
    background:var(--cream-1); color:var(--ink); font-family:var(--font-sans);
    -webkit-font-smoothing:antialiased; min-height:100%;
    background-image:
      radial-gradient(60% 40% at 25% 18%, rgba(201,163,98,.16), transparent 70%),
      radial-gradient(55% 38% at 80% 26%, rgba(159,176,198,.12), transparent 70%),
      radial-gradient(70% 45% at 55% 60%, rgba(217,138,152,.14), transparent 72%),
      radial-gradient(60% 40% at 30% 92%, rgba(201,163,98,.12), transparent 72%),
      linear-gradient(170deg, var(--cream-1), var(--cream-2));
    background-attachment: fixed;
  }
  .wrap{ max-width:420px; margin:0 auto; padding:34px 20px 48px;
    display:flex; flex-direction:column; align-items:center; text-align:center; }
  .frame{ width:100%; border:1px solid var(--line); border-radius:14px;
    padding:30px 22px 26px; position:relative; background:rgba(255,253,247,.35); backdrop-filter:blur(2px); }
  .sprig{ width:92px; height:60px; margin:0 auto 6px; display:block; }
  .name{ font-family:var(--font-script); font-weight:400; font-size:3.5rem; line-height:1;
    margin:.1em 0 .15em; color:var(--ink); }
  .flourish{ width:120px; height:10px; margin:2px auto 10px; display:block; }
  .sub{ font-family:var(--font-sans); font-weight:500; font-size:.72rem; letter-spacing:.18em;
    text-transform:uppercase; color:var(--gold); }
  .practice{ font-family:var(--font-serif); font-style:italic; font-size:1.02rem; color:var(--ink-soft); margin-top:5px; }

  .rows{ width:100%; margin:22px 0 6px; display:flex; flex-direction:column; gap:10px; }
  .row{ display:flex; align-items:center; gap:13px; padding:12px 14px; border-radius:11px;
    border:1px solid var(--line); background:rgba(255,253,247,.5); text-decoration:none; color:var(--ink); }
  .row .ico{ width:20px; height:20px; flex:none; color:var(--gold); }
  .row .lbl{ flex:1; min-width:0; text-align:left; }
  .row .lbl b{ display:block; font-weight:500; font-size:.94rem; }
  .row .lbl span{ display:block; font-size:.74rem; color:var(--ink-soft); letter-spacing:.04em; margin-top:1px;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .copy{ flex:none; border:1px solid var(--line); background:transparent; color:var(--gold);
    font:500 .66rem var(--font-sans); letter-spacing:.08em; text-transform:uppercase;
    padding:6px 10px; border-radius:8px; cursor:pointer; }
  .copy:active{ background:rgba(181,138,62,.12); }
  .copy.done{ color:#2e7d57; border-color:#2e7d57; }

  .save{ width:100%; margin-top:18px; display:flex; align-items:center; justify-content:center; gap:10px;
    padding:15px; border-radius:12px; border:none; cursor:pointer; text-decoration:none;
    background:linear-gradient(160deg, var(--gold-soft), var(--gold)); color:#fff;
    font:600 1rem var(--font-sans); letter-spacing:.02em; box-shadow:0 10px 24px -10px rgba(181,138,62,.6); }
  .save svg{ width:20px; height:20px; }
  .hint{ font-size:.72rem; color:var(--ink-soft); margin-top:10px; letter-spacing:.03em; }
  .foot{ font-family:var(--font-sans); font-size:.68rem; letter-spacing:.22em; text-transform:uppercase;
    color:var(--ink-soft); opacity:.75; margin-top:26px; }
  @media (max-width:360px){ .name{font-size:3rem} }
</style>
</head>
<body>
  <main class="wrap">
    <div class="frame">

          <path d="M60 52 C50 50 42 44 40 36" stroke="#9aa06a"/>
          <path d="M60 50 C70 48 78 42 80 34" stroke="#9aa06a"/>
          <circle cx="60" cy="26" r="9"/>
          <path d="M60 17 C66 17 70 21 70 26"/>
          <path d="M60 35 C54 35 50 31 50 26"/>
          <circle cx="42" cy="30" r="6"/><circle cx="78" cy="30" r="6"/>
          <circle cx="60" cy="26" r="2.2" fill="var(--gold)"/>
        </g>
      </svg>
      <h1 class="name">Amy Berge</h1>
      <svg class="flourish" viewBox="0 0 120 10" fill="none" stroke="var(--gold)" stroke-width="1.2" stroke-linecap="round">
        <path d="M6 5 Q30 0 54 5"/><path d="M114 5 Q90 0 66 5"/>

      <div class="sub">Principal Partner &middot; Gray Ice Higdon</div>

      <div class="rows">
        <a class="row" href="tel:+15026252887">
          <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3 19.5 19.5 0 0 1-6-6 19.8 19.8 0 0 1-3-8.6A2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1.9.4 1.8.7 2.7a2 2 0 0 1-.5 2.1L8.1 9.9a16 16 0 0 0 6 6l1.4-1.2a2 2 0 0 1 2.1-.5c.9.3 1.8.6 2.7.7a2 2 0 0 1 1.7 2z"/></svg>
          <span class="lbl"><b>Call</b><span>(502) 625-2887</span></span>
          <button class="copy" type="button" data-copy="(502) 625-2887" aria-label="Copy phone">Copy</button>
        </a>
        <a class="row" href="mailto:ABerge@GrayIce.com">
          <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/></svg>
          <span class="lbl"><b>Email</b><span>ABerge@GrayIce.com</span></span>

          <span class="lbl"><b>Website</b><span>grayice.com</span></span>
        </a>
        <a class="row" href="https://maps.google.com/?q=3939+Shelbyville+Road+Suite+201+Louisville+KY+40207" target="_blank" rel="noopener">
          <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M21 10c0 6-9 12-9 12s-9-6-9-12a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>
          <span class="lbl"><b>Office</b><span>3939 Shelbyville Rd, Ste 201 &middot; Louisville</span></span>
        </a>
      </div>

      <a class="save" href="amy-berge.vcf" download="AmyBerge.vcf">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M19 8v6M22 11h-6"/></svg>
        Save to my contacts

      <div class="hint">Add me to your phone &mdash; no app needed</div>
      <div class="foot">Louisville &middot; Kentucky</div>
    </div>
  </main>
<script>
  document.querySelectorAll('.copy').forEach(function(btn){
    btn.addEventListener('click', function(e){
      e.preventDefault(); e.stopPropagation();
      var txt = btn.getAttribute('data-copy');
      function ok(){ var o=btn.textContent; btn.textContent='Copied'; btn.classList.add('done');
        setTimeout(function(){ btn.textContent=o; btn.classList.remove('done'); }, 1400); }
      if(navigator.clipboard && navigator.clipboard.writeText){
        navigator.clipboard.writeText(txt).then(ok).catch(function(){ fallback(txt, ok); });
      } else { fallback(txt, ok); }
    });
  });
  function fallback(txt, ok){
    try{ var ta=document.createElement('textarea'); ta.value=txt; ta.style.position='fixed'; ta.style.opacity='0';
      document.body.appendChild(ta); ta.focus(); ta.select(); document.execCommand('copy'); document.body.removeChild(ta); ok(); }
    catch(err){}
  }
</script>
</body>
</html>
