<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;1,9..144,500&family=Bitter:wght@500;600;700&family=Mulish:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<title>Amy Berge Derby</title>
<style>
  /* Amy Berge — Gray Ice Higdon networking card. Contact + credibility. Navy + gold, serif.
     Themed photo hero, optional avatar, practice areas, 4 contact actions, vCard QR.
     Derby variant adds rose petals + gold foil. */
  :root {
    --stage: #0b111a; --card-1: #121b27; --card-2: #1e2c3e;
    --ink: #eef1f6; --muted: #9aa6b6; --gold: #a29160; --gold-soft: #cbbb8a;
    --line: rgba(162,145,96,0.34);
    --font-display: "Fraunces", "Bitter", Georgia, "Times New Roman", serif;
    --font-body: "Mulish", "Segoe UI", system-ui, sans-serif; color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; background: var(--stage); color: var(--ink); font-family: var(--font-body); -webkit-font-smoothing: antialiased; }
  .stage { position: relative; min-height: 100%; display: flex; align-items: center; justify-content: center; padding: 28px 16px;
    background: radial-gradient(120% 60% at 50% 0%, #15202c, var(--stage) 70%); }
  #petals { position: fixed; inset: 0; z-index: 9; pointer-events: none; }
  .scene { position: relative; perspective: 1300px; width: 100%; max-width: 346px; opacity: 0; animation: fade .7s ease .05s forwards; }
  @keyframes fade { to { opacity: 1; } }
  .card { position: relative; border-radius: 20px; overflow: hidden;
    background: linear-gradient(170deg, var(--card-2), var(--card-1) 70%);
    border: 1px solid rgba(255,255,255,0.07);
    box-shadow: 0 30px 70px -30px rgba(0,0,0,0.92), inset 0 0 0 1px rgba(162,145,96,0.1);
    transform-style: preserve-3d; transform: rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg));
    transition: transform .2s ease-out; will-change: transform; }
  .card::before { content: ""; position: absolute; inset: 0; border-radius: inherit; z-index: 7; pointer-events: none;
    background: radial-gradient(170px 170px at var(--px,50%) var(--py,10%), rgba(255,255,255,0.1), rgba(255,255,255,0) 60%); mix-blend-mode: screen; }
  .foil { position: absolute; inset: 0; z-index: 6; pointer-events: none; opacity: 0;
    background: linear-gradient(110deg, transparent 36%, rgba(203,187,138,0.55) 47%, rgba(255,246,214,0.5) 52%, rgba(203,187,138,0.4) 57%, transparent 70%);
    background-size: 240% 240%; background-position: calc(var(--fx,50)*1%) calc(var(--fy,50)*1%); mix-blend-mode: color-dodge; }
  .derby .foil { opacity: .5; }
  .hero { position: relative; width: 100%; height: 196px; overflow: hidden; }
  .hero img { width: 100%; height: 100%; object-fit: cover; object-position: 50% 46%; display: block;
    transform: scale(1.12) translate(var(--hx,0px), var(--hy,0px)); transition: transform .2s ease-out; }
  .hero::after { content: ""; position: absolute; inset: 0; background: linear-gradient(to bottom, rgba(18,27,39,0.05) 26%, rgba(18,27,39,0.5), var(--card-1)); }
  .avatar { position: absolute; left: 50%; top: 130px; transform: translateX(-50%); z-index: 5;
    width: 106px; height: 106px; border-radius: 50%; object-fit: cover; object-position: 50% 28%;
    border: 1px solid rgba(255,255,255,0.15); box-shadow: 0 0 0 4px var(--card-1), 0 0 0 5px var(--gold), 0 12px 26px -10px rgba(0,0,0,0.8); }
  .no-avatar .avatar { display: none; }
  .no-avatar .hero { height: 310px; }
  .no-avatar .hero img { object-position: 50% 42%; }
  .no-avatar .hero::after { background: linear-gradient(to bottom, rgba(18,27,39,0) 74%, rgba(18,27,39,0.4), var(--card-1)); }
  .body { position: relative; z-index: 4; padding: 58px 24px 24px; text-align: center; }
  .no-avatar .body { padding-top: 20px; }
  .eyebrow { margin: 0 0 6px; font-size: .68rem; letter-spacing: .28em; text-transform: uppercase; color: var(--gold); }
  .name { font-family: var(--font-display); font-weight: 600; font-size: 1.95rem; line-height: 1.04; margin: 0; color: #fff; text-wrap: balance;
    background: linear-gradient(100deg, #fff, var(--gold-soft) 44%, #fff 60%, var(--gold-soft) 80%, #fff); background-size: 220% auto;
    -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; animation: shine 7s linear infinite; }
  @keyframes shine { to { background-position: 220% center; } }
  .title { margin: 7px 0 0; font-size: .74rem; letter-spacing: .26em; text-transform: uppercase; color: var(--muted); }
  .gih { display: block; width: 158px; max-width: 60%; height: auto; margin: 14px auto 0; }
  .areas { margin: 12px auto 0; max-width: 28ch; font-size: .82rem; color: var(--gold-soft); line-height: 1.5; }
  .loc { margin: 6px 0 0; font-size: .72rem; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
  .rule { width: 44px; height: 1px; background: var(--line); margin: 16px auto 0; }

  .actions { margin: 16px 0 0; display: grid; grid-template-columns: 1fr 1fr; gap: 9px; }
  .link { display: flex; align-items: center; justify-content: center; gap: 8px; padding: 11px 10px; border-radius: 10px;
    border: 1px solid rgba(203,187,138,0.24); background: rgba(203,187,138,0.05); color: var(--ink); text-decoration: none; font-weight: 600; font-size: .86rem;
    transition: border-color .15s, background .15s, transform .15s; }
  .link:hover { border-color: var(--gold); background: rgba(162,145,96,0.13); transform: translateY(-1px); }
  .link svg { width: 16px; height: 16px; color: var(--gold); }

  .savebtn { display: flex; align-items: center; justify-content: center; gap: 9px; margin: 16px 0 2px; padding: 13px 16px; border-radius: 12px;
    border: none; background: linear-gradient(160deg, var(--gold-soft), var(--gold)); color: #15222c; font: inherit; font-weight: 700; font-size: .92rem;
    text-decoration: none; cursor: pointer; box-shadow: 0 10px 22px -10px rgba(203,187,138,0.7); transition: transform .12s ease; }
  .savebtn:hover { transform: translateY(-1px); }
  .savebtn svg { width: 18px; height: 18px; }

  .foot { position: fixed; left: 0; right: 0; bottom: 10px; text-align: center; font-size: .64rem; color: rgba(154,166,182,0.5); z-index: 10; }
  @media (prefers-reduced-motion: reduce) { .card, .hero img { transition: none; } .name { animation: none; } .scene { animation: none; opacity: 1; } #petals { display: none; } }
</style>
</head>
